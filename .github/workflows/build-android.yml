name: Build Android (sovereignty gated)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sovereignty-gate:
    name: Mandatory sovereignty and release-surface gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify labels, sources and fail-closed output registry
        run: python3 scripts/sovereignty_gate.py
      - name: Negative regression tests
        run: python3 -m unittest discover -s tests -v
  assemble:
    name: Build APK only after mandatory gate PASS
    needs: sovereignty-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish only if build succeeded
        uses: actions/upload-artifact@v4
        with:
          name: TTX-WazeMod10-Bridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
