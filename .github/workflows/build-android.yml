name: Build TTX WazeMod10 Bridge APK (sovereignty gate)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sovereignty-gate:
    name: Mandatory sovereignty gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Vietnamese map presentation policy and block unverified map assets
        run: python3 scripts/sovereignty_gate.py
      - name: Verify fail-closed regression tests
        run: python3 -m unittest discover -s tests -v
  assemble:
    name: Build APK only after gate PASS
    needs: sovereignty-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK from runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test offline GPS matching algorithms
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build standalone debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TTX-Independent-SpeedSigns-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
